name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm's resolver crashes on this peer set without --legacy-peer-deps (see CLAUDE.md).
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
